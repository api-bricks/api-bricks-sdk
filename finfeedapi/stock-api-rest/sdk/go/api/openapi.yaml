      example:
        symbol: symbol
        timestamp_nanos: 0
        timestamp: 2000-01-23T04:56:07.000+00:00
        is_side_buy: true
        is_event_processing_complete: true
        size: 6
        price: 1.4658129805029452
      properties:
        symbol:
          description: The stock symbol
          nullable: true
          type: string
        timestamp_nanos:
          description: Original timestamp in nanoseconds since epoch
          format: int64
          type: integer
        timestamp:
          description: Time when the price level update was recorded as DateTime
          format: date-time
          type: string
        is_side_buy:
          description: Indicates if this is a price level update for the Buy Side.
          type: boolean
        is_event_processing_complete:
          description: Indicates if event processing is complete.
          type: boolean
        size:
          description: Aggregate quoted size at the price level
          format: int32
          type: integer
        price:
          description: Price level as decimal
          format: double
          type: number
      type: object
    IEXQuoteUpdate.QuoteUpdateModel:
      additionalProperties: false
      description: Represents the response DTO for quote update information
      example:
        symbol: symbol
        timestamp_nanos: 0
        timestamp: 2000-01-23T04:56:07.000+00:00
        is_symbol_available: true
        is_pre_post_market_session: true
        ask_size: 6
        ask_price: 1.4658129805029452
        bid_price: 5.962133916683182
        bid_size: 5
      properties:
        symbol:
          description: The stock symbol
          nullable: true
          type: string
        timestamp_nanos:
          description: Original timestamp in nanoseconds since epoch
          format: int64
          type: integer
        timestamp:
          description: Time when the quote update was recorded as DateTime
          format: date-time
          type: string
        is_symbol_available:
          description: |-
            Gets whether the symbol is available for trading
            True if active, False if halted, paused, or otherwise not available
          type: boolean
        is_pre_post_market_session:
          description: |-
            Gets whether the market session is regular or pre/post-market
            True if pre/post-market session, False if regular market session
          type: boolean
        ask_size:
          description: Ask size in number of shares
          format: int32
          type: integer
        ask_price:
          description: Ask price as decimal
          format: double
          type: number
        bid_price:
          description: Bid price as decimal
          format: double
          type: number
        bid_size:
          description: Bid size in number of shares
          format: int32
          type: integer
      type: object
    IEXSystemEvent.SystemEventModel:
      additionalProperties: false
      description: Represents the response DTO for system event information
      example:
        timestamp_nanos: 0
        timestamp: 2000-01-23T04:56:07.000+00:00
        system_event: 6
        system_event_code: system_event_code
        system_event_text: system_event_text
        is_system_event_start_of_messages: true
        is_system_event_start_of_system_hours: true
        is_system_event_start_of_regular_market_hours: true
        is_system_event_end_of_regular_market_hours: true
        is_system_event_end_of_system_hours: true
        is_system_event_end_of_messages: true
      properties:
        timestamp_nanos:
          description: Original timestamp in nanoseconds since epoch
          format: int64
          type: integer
        timestamp:
          description: Time when the system event was recorded as DateTime
          format: date-time
          type: string
        system_event:
          description: System event as byte value
          format: int32
          type: integer
        system_event_code:
          description: System event as string
          nullable: true
          type: string
        system_event_text:
          description: Human-readable description of the system event
          nullable: true
          type: string
        is_system_event_start_of_messages:
          description: "Indicates if the system event is 'Start of Messages' (O).\n\
            Outside of heartbeat messages on the lower level protocol, \nthe start\
            \ of day message is the first message sent in any trading session."
          type: boolean
        is_system_event_start_of_system_hours:
          description: |-
            Indicates if the system event is 'Start of System Hours' (S).
            This message indicates that IEX is open and ready to start accepting orders.
          type: boolean
        is_system_event_start_of_regular_market_hours:
          description: "Indicates if the system event is 'Start of Regular Market\
            \ Hours' (R).\nThis message indicates that DAY and GTX orders, as well\
            \ as market orders and pegged orders, \nare available for execution on\
            \ IEX."
          type: boolean
        is_system_event_end_of_regular_market_hours:
          description: "Indicates if the system event is 'End of Regular Market Hours'\
            \ (M).\nThis message indicates that DAY orders, market orders, and pegged\
            \ orders \nare no longer accepted by IEX."
          type: boolean
        is_system_event_end_of_system_hours:
          description: "Indicates if the system event is 'End of System Hours' (E).\n\
            This message indicates that IEX is now closed and will not accept \nany\
            \ new orders during this trading session. It is still possible \nto receive\
            \ messages after the end of day."
          type: boolean
        is_system_event_end_of_messages:
          description: |-
            Indicates if the system event is 'End of Messages' (C).
            This is always the last message sent in any trading session.
          type: boolean
      type: object
    IEXTrade.TradeModel:
      additionalProperties: false
      description: Represents the response DTO for a single trade event (report or
        break).
      example:
        is_trade_break: true
        symbol: symbol
        timestamp_nanos: 0
        timestamp: 2000-01-23T04:56:07.000+00:00
        size: 6
        price: 1.4658129805029452
        trade_id: 5
        is_intermarket_sweep: true
        is_extended_hours_trade: true
        is_odd_lot_trade: true
        is_trade_through_exempt: true
        is_single_price_cross_trade: true
      properties:
        is_trade_break:
          description: Indicates if this record represents a trade break (true) or
            a trade report (false).
          type: boolean
        symbol:
          description: The stock symbol.
          nullable: true
          type: string
        timestamp_nanos:
          description: Original timestamp in nanoseconds since epoch.
          format: int64
          type: integer
        timestamp:
          description: Time when the event was recorded as DateTime (UTC).
          format: date-time
          type: string
        size:
          description: Trade volume (or break volume) in number of shares.
          format: int32
          type: integer
        price:
          description: Trade price (or break price) as decimal.
          format: double
          type: number
        trade_id:
          description: IEX trade identifier (same for report and its corresponding
            break).
          format: int64
          type: integer
        is_intermarket_sweep:
          description: |-
            Bit 7 (Mask 0x80): Intermarket Sweep Flag.
            True: Intermarket Sweep Order ("ISO").
            False: Non-Intermarket Sweep Order.
          type: boolean
        is_extended_hours_trade:
          description: |-
            Bit 6 (Mask 0x40): Extended Hours Flag.
            True: Extended Hours Trade (i.e., Form T sale condition).
            False: Regular Market Session Trade.
          type: boolean
        is_odd_lot_trade:
          description: |-
            Bit 5 (Mask 0x20): Odd Lot Flag.
            True: Odd Lot Trade.
            False: Round or Mixed Lot Trade.
          type: boolean
        is_trade_through_exempt:
          description: |-
            Bit 4 (Mask 0x10): Trade Through Exempt Flag.
            True: Trade is not subject to Rule 611 (Trade Through) of SEC Reg. NMS.
            False: Trade is subject to Rule 611 (Trade Through) of SEC Reg. NMS.
            Applied when the taking order was an ISO that traded through a protected quotation,
            OR the NBBO was crossed at the time of the trade,
            OR the trade occurred through a self-helped venue's quotation,
            OR the trade was a single-price cross.
          type: boolean
        is_single_price_cross_trade:
          description: |-
            Bit 3 (Mask 0x08): Single-price Cross Trade Flag.
            True: Trade resulting from a single-price cross.
            False: Execution during continuous trading.
          type: boolean
      type: object
    Models.AddOrderModel:
      additionalProperties: false
      description: Represents the response DTO for add order information
      example:
        symbol: symbol
        timestamp_nanos: 0
        timestamp: 2000-01-23T04:56:07.000+00:00
        is_side_buy: true
        size: 6
        price: 1.4658129805029452
        order_id: 5
      properties:
        symbol:
          description: The stock symbol
          nullable: true
          type: string
        timestamp_nanos:
          description: Original timestamp in nanoseconds since epoch
          format: int64
          type: integer
        timestamp:
          description: Time when the order was added as DateTime (UTC)
          format: date-time
          type: string
        is_side_buy:
          description: Indicates if this is a Buy order ('8'/0x38).
          type: boolean
        size:
          description: Quoted size in number of shares
          format: int32
          type: integer
        price:
          description: Price as decimal
          format: double
          type: number
        order_id:
          description: Order identifier
          format: int64
          type: integer
      type: object
    Models.AdminMessageModel:
      additionalProperties: false
      description: "Represents the response DTO for IEX admin information, combining\
        \ all symbol-based admin message types"
      example:
        trading_status:
          symbol: symbol
          timestamp_nanos: 0
          timestamp: 2000-01-23T04:56:07.000+00:00
          is_trading_live: true
          is_trading_halted: true
          is_trading_in_order_acceptance_period: true
          is_trading_paused: true
          is_reason_halt_news_pending: true
          is_reason_ipo_not_yet_trading: true
          is_reason_ipo_deferred: true
          is_reason_halt_news_dissemination: true
          is_reason_ipo_order_acceptance_period: true
          is_reason_ipo_pre_launch_period: true
