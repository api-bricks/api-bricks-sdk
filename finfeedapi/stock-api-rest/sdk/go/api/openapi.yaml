  /v1/ohlcv/exchange/{exchange_id}/history:
    get:
      description: |-
        Get OHLCV timeseries data returned in time ascending order. Data can be requested by the period and for the specific exchange.
        Time range is limited to 24 hours. Use `limit` to cap the number of symbol rows returned.
      parameters:
      - description: Exchange identifier of requested timeseries (from the Metadata
          -> Exchanges)
        explode: false
        in: path
        name: exchange_id
        required: true
        schema:
          type: string
        style: simple
      - description: Identifier of requested timeseries period (e.g. `5SEC` or `1DAY`)
        explode: true
        in: query
        name: period_id
        required: true
        schema:
          type: string
        style: form
      - description: Timeseries starting time in ISO 8601
        explode: true
        in: query
        name: time_start
        required: true
        schema:
          type: string
        style: form
      - description: Timeseries ending time in ISO 8601
        explode: true
        in: query
        name: time_end
        required: true
        schema:
          type: string
        style: form
      - description: "Maximum number of symbol rows to return (1-10000, default 100)"
        explode: true
        in: query
        name: limit
        required: false
        schema:
          default: 100
          format: int32
          type: integer
        style: form
      responses:
        "200":
          content:
            text/plain:
              schema:
                items:
                  $ref: "#/components/schemas/OHLCVTimeSeries.ExchangeTimeseriesItem"
                type: array
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/OHLCVTimeSeries.ExchangeTimeseriesItem"
                type: array
            text/json:
              schema:
                items:
                  $ref: "#/components/schemas/OHLCVTimeSeries.ExchangeTimeseriesItem"
                type: array
          description: successful operation
      summary: Historical data by exchange
      tags:
      - Ohlcv
  /v1/ohlcv/exchange-symbol/{exchange_id}/{symbol_id}/latest:
    get:
      description: "Get OHLCV latest timeseries data returned in time descending order.\
        \ Data can be requested by the period and for the specific symbol eg `BITSTAMP_SPOT_BTC_USD`,\
        \ if you need to query timeseries by asset pairs eg. `BTC/USD`, then please\
        \ reffer to the Exchange Rates Timeseries data\n            \n:::info\nOHLCV\
        \ Latest endpoint is just the shortcut to the OHLCV Historical endpoint with\
        \ substituted `time_start` and `time_end` parameters. \nThe OHLCV Historical\
        \ endpoint data can be delayed a few seconds. Use OHLCV real-time data stream\
        \ to get data without delay.\n:::"
      parameters:
      - description: Exchange identifier of requested timeseries (from the Metadata
          -> Exchanges)
        explode: false
        in: path
        name: exchange_id
        required: true
        schema:
          type: string
        style: simple
      - description: Symbol identifier of requested timeseries (from the Metadata
          -> Symbols)
        explode: false
        in: path
        name: symbol_id
        required: true
        schema:
          type: string
        style: simple
      - description: Identifier of requested timeseries period (e.g. `5SEC` or `2MTH`)
        explode: true
        in: query
        name: period_id
        required: true
        schema:
          type: string
        style: form
      - description: "Amount of items to return (mininum is 1, maximum is 100000,\
          \ default value is 100, if the parameter is used then every 100 output items\
          \ are counted as one request)"
        explode: true
        in: query
        name: limit
        required: false
        schema:
          default: 100
          format: int32
          type: integer
        style: form
      responses:
        "200":
          content:
            text/plain:
              examples:
                Example response:
                  value:
                  - time_period_start: 2017-08-09T14:31:00.0000000Z
                    time_period_end: 2017-08-09T14:32:00.0000000Z
