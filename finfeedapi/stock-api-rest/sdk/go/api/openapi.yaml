    Models.ExecutedOrderModel:
      additionalProperties: false
      description: Represents the response DTO for order executed information
      example:
        symbol: symbol
        timestamp_nanos: 4
        timestamp: 2000-01-23T04:56:07.000+00:00
        order_id_reference: 7
        sale_condition_flags: 1
        is_intermarket_sweep: true
        is_extended_hours_trade: true
        is_odd_lot_trade: true
        is_trade_through_exempt: true
        is_single_price_cross_trade: true
        size: 1
        price: 1.4894159098541704
        trade_id: 6
      properties:
        symbol:
          description: The stock symbol
          nullable: true
          type: string
        timestamp_nanos:
          description: Original timestamp in nanoseconds since epoch
          format: int64
          type: integer
        timestamp:
          description: Time when the order was executed as DateTime
          format: date-time
          type: string
        order_id_reference:
          description: Order identifier reference
          format: int64
          type: integer
        sale_condition_flags:
          description: Sale condition flags for the execution as byte value
          format: int32
          type: integer
        is_intermarket_sweep:
          description: |-
            Bit 7 (Mask 0x80): Intermarket Sweep Flag
            True: Intermarket Sweep Order ("ISO")
            False: Non-Intermarket Sweep Order
          type: boolean
        is_extended_hours_trade:
          description: |-
            Bit 6 (Mask 0x40): Extended Hours Flag
            True: Extended Hours Trade (i.e., Form T sale condition)
            False: Regular Market Session Trade
          type: boolean
        is_odd_lot_trade:
          description: |-
            Bit 5 (Mask 0x20): Odd Lot Flag
            True: Odd Lot Trade
            False: Round or Mixed Lot Trade
          type: boolean
        is_trade_through_exempt:
          description: |-
            Bit 4 (Mask 0x10): Trade Through Exempt Flag
            True: Trade is not subject to Rule 611 (Trade Through) of SEC Reg. NMS
            False: Trade is subject to Rule 611 (Trade Through) of SEC Reg. NMS
          type: boolean
        is_single_price_cross_trade:
          description: |-
            Bit 3 (Mask 0x08): Single-price Cross Trade Flag
            True: Trade resulting from a single-price cross
            False: Execution during continuous trading
          type: boolean
        size:
          description: Trade volume in number of shares
          format: int32
          type: integer
        price:
          description: Execution price as decimal
          format: double
          type: number
        trade_id:
          description: IEX trade identifier
          format: int64
          type: integer
      type: object
