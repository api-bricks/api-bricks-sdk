openapi: 3.0.4
info:
  contact:
    email: support@apibricks.io
    name: API BRICKS LTD
    url: https://www.finfeedapi.com
  license:
    name: MIT License
    url: https://github.com/api-bricks/api-bricks-sdk/blob/master/LICENSE
  title: FinFeedAPI Stock REST API
  version: v1
servers:
- url: https://api-historical.stock.finfeedapi.com
security:
- APIKey: []
- JWT: []
tags:
- description: "Provides access to OHLCV (Open, High, Low, Close, Volume) timeseries\
    \ data."
  name: Ohlcv
  x-displayName: Ohlcv
- description: Provides access to exchange and symbol metadata.
  name: Metadata
  x-displayName: Metadata
- description: Provides access to IEX market data endpoints.
  name: NativeIEX
  x-displayName: NativeIEX
paths:
  /v1/symbols/{exchange_id}:
    get:
      description: |-
        Results are paginated. Use `limit` and `page` to control page size and offset
        (default limit: 100, max: 10000, default page: 1).
      parameters:
      - description: The ID of the exchange (from the Metadata -> Exchanges)
        explode: false
        in: path
        name: exchange_id
        required: true
        schema:
          type: string
        style: simple
      - description: "Comma or semicolon delimited symbol identifiers used to filter\
          \ response (optional, eg. `TSLA` or `TSLA,NVDA`)"
        explode: true
        in: query
        name: filter_symbol_id
        required: false
        schema:
          type: string
        style: form
      - description: "Maximum number of symbols to return (1-10000, default 100)"
        explode: true
        in: query
        name: limit
        required: false
        schema:
          default: 100
          format: int32
          type: integer
        style: form
      - description: "Page number (1-based, default 1)"
        explode: true
        in: query
        name: page
        required: false
        schema:
          default: 1
          format: int32
          type: integer
        style: form
      responses:
        "200":
          content:
            text/plain:
              examples:
                Example response:
                  value:
                  - symbol_id: TSLA
                    exchange_id: IEXG
                    security_category: Common Stock
                    name: TESLA INC
                    date: 2026-08-18
                  - symbol_id: NVDA
                    exchange_id: IEXG
                    security_category: Common Stock
                    name: NVIDIA CORP
                    date: 2026-08-18
              schema:
                items:
                  $ref: "#/components/schemas/FinFeedAPI.SymbolModel"
                type: array
            application/json:
              examples:
                Example response:
                  value:
                  - symbol_id: TSLA
                    exchange_id: IEXG
                    security_category: Common Stock
                    name: TESLA INC
                    date: 2026-08-18
                  - symbol_id: NVDA
                    exchange_id: IEXG
                    security_category: Common Stock
                    name: NVIDIA CORP
                    date: 2026-08-18
              schema:
                items:
                  $ref: "#/components/schemas/FinFeedAPI.SymbolModel"
                type: array
            text/json:
              examples:
                Example response:
                  value:
                  - symbol_id: TSLA
                    exchange_id: IEXG
                    security_category: Common Stock
                    name: TESLA INC
                    date: 2026-08-18
                  - symbol_id: NVDA
                    exchange_id: IEXG
                    security_category: Common Stock
                    name: NVIDIA CORP
                    date: 2026-08-18
              schema:
                items:
                  $ref: "#/components/schemas/FinFeedAPI.SymbolModel"
                type: array
          description: successful operation
      summary: List of symbols for the exchange
      tags:
      - Metadata
