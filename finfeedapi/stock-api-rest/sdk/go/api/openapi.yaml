  /v1/ohlcv/periods:
    get:
      description: "Get full list of supported time periods available for requesting\
        \ OHLCV timeseries data.\n            \n### Available periods\n          \
        \  \nTime unit | Period identifiers\n--------- | -----------\nSecond | 1SEC,\
        \ 2SEC, 3SEC, 4SEC, 5SEC, 6SEC, 10SEC, 15SEC, 20SEC, 30SEC\nMinute | 1MIN,\
        \ 2MIN, 3MIN, 4MIN, 5MIN, 6MIN, 10MIN, 15MIN, 20MIN, 30MIN\nHour | 1HRS, 2HRS,\
        \ 3HRS, 4HRS, 6HRS, 8HRS, 12HRS\nDay | 1DAY, 2DAY, 3DAY, 5DAY, 7DAY, 10DAY\n\
        Month | 1MTH, 2MTH, 3MTH, 4MTH, 6MTH\nYear | 1YRS, 2YRS, 3YRS, 4YRS, 5YRS\n\
        \            \n:::tip\nYou can assume that we will not remove any periods\
        \ from this response, however, we may add new ones.\n:::"
      responses:
        "200":
          content:
            text/plain:
              examples:
                Example response:
                  value:
                  - period_id: 1SEC
                    length_seconds: 1
                    length_months: 0
                    unit_count: 1
                    unit_name: second
                    display_name: 1 Second
                  - period_id: 10DAY
                    length_seconds: 864000
                    length_months: 0
                    unit_count: 10
                    unit_name: day
                    display_name: 10 Days
                  - period_id: 2YRS
                    length_seconds: 0
                    length_months: 24
                    unit_count: 2
                    unit_name: year
                    display_name: 2 Years
              schema:
                items:
                  $ref: "#/components/schemas/OHLCVTimeSeries.TimeseriesPeriod"
                type: array
            application/json:
              examples:
                Example response:
                  value:
                  - period_id: 1SEC
                    length_seconds: 1
                    length_months: 0
                    unit_count: 1
                    unit_name: second
                    display_name: 1 Second
                  - period_id: 10DAY
                    length_seconds: 864000
                    length_months: 0
                    unit_count: 10
                    unit_name: day
                    display_name: 10 Days
                  - period_id: 2YRS
                    length_seconds: 0
                    length_months: 24
                    unit_count: 2
                    unit_name: year
                    display_name: 2 Years
              schema:
                items:
                  $ref: "#/components/schemas/OHLCVTimeSeries.TimeseriesPeriod"
                type: array
            text/json:
              examples:
                Example response:
                  value:
                  - period_id: 1SEC
                    length_seconds: 1
                    length_months: 0
                    unit_count: 1
                    unit_name: second
                    display_name: 1 Second
                  - period_id: 10DAY
                    length_seconds: 864000
                    length_months: 0
                    unit_count: 10
                    unit_name: day
                    display_name: 10 Days
                  - period_id: 2YRS
                    length_seconds: 0
                    length_months: 24
                    unit_count: 2
                    unit_name: year
                    display_name: 2 Years
              schema:
                items:
                  $ref: "#/components/schemas/OHLCVTimeSeries.TimeseriesPeriod"
                type: array
          description: successful operation
      summary: List all periods
      tags:
      - Ohlcv
  /v1/ohlcv/exchange-symbol/{exchange_id}/{symbol_id}/history:
    get:
      description: Get OHLCV timeseries data returned in time ascending order.
      parameters:
      - description: Exchange identifier of requested timeseries (from the Metadata
          -> Exchanges)
        explode: false
        in: path
        name: exchange_id
        required: true
        schema:
          type: string
        style: simple
      - description: Symbol identifier of requested timeseries (from the Metadata
          -> Symbols)
        explode: false
        in: path
        name: symbol_id
        required: true
        schema:
          type: string
        style: simple
      - description: Identifier of requested timeseries period (e.g. `5SEC` or `2MTH`)
        explode: true
        in: query
        name: period_id
        required: true
        schema:
          type: string
        style: form
      - description: Timeseries starting time in ISO 8601
        explode: true
        in: query
        name: time_start
        required: false
        schema:
          type: string
        style: form
      - description: Timeseries ending time in ISO 8601
        explode: true
        in: query
        name: time_end
        required: false
        schema:
          type: string
        style: form
      - description: "Amount of items to return (mininum is 1, maximum is 100000,\
          \ default value is 100, if the parameter is used then every 100 output items\
          \ are counted as one request)"
        explode: true
        in: query
        name: limit
        required: false
        schema:
          default: 100
          format: int32
          type: integer
