              examples:
                Example list:
                  value:
                    - market_id: WILL-TRUMP-SELL-10K-25K-GOLD-CARDS-IN-2025_YES
                      title: Will Trump sell 10k-25k Gold Cards in 2025?
                      description: Resolves based on official reporting by the Trump Administration.
