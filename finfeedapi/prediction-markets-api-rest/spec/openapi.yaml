  '/v1/markets/{exchange_id}/active':
    get:
      tags:
        - Markets
      summary: Lists active market IDs for a specific exchange.
      description: "Returns only market IDs (not full market objects) because this data is derived from recent quotes and transactions only.\nUse the /history endpoint to retrieve full market details."
      parameters:
        - name: exchange_id
          in: path
          description: 'The unique identifier of the exchange (e.g., `POLYMARKET`).'
          required: true
          schema:
            type: string
        - name: limit
          in: query
          description: 'Maximum number of market IDs to return (1-10000, default 100).'
          schema:
            type: integer
            format: int32
            default: 100
        - name: page
          in: query
          description: 'Page number (1-based, >= 1, default 1). Internally converted to offset = (page - 1) * limit.'
          schema:
            type: integer
            format: int32
            default: 1
      responses:
        '200':
          description: A list of active market IDs for the given exchange.
          content:
            text/plain:
              schema:
                type: array
                items:
                  type: string
              examples:
                Example active market IDs:
                  value:
                    - WILL-TRUMP-SELL-10K-25K-GOLD-CARDS-IN-2025_YES
                    - WILL-TRUMP-SELL-10K-25K-GOLD-CARDS-IN-2025_NO
                    - NFL-PIT-CAR-2025-08-21-SPREAD-AWAY-5PT5_YES
                    - NFL-PIT-CAR-2025-08-21-SPREAD-AWAY-5PT5_NO
                    - CRYPTO-BTC-PRICE-ABOVE-100K-BY-EOY-2025_YES
            application/json:
              schema:
                type: array
                items:
