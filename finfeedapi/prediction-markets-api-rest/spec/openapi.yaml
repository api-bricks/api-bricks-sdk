          type: number
          description: Gets or sets the closing price.
          format: double
          nullable: true
        volume_traded:
          type: number
          description: Gets or sets the total volume traded during the time period.
          format: double
        trades_count:
          type: integer
          description: Gets or sets the number of trades executed during the time period.
          format: int64
      additionalProperties: false
      description: Represents a timeseries item with price and volume information.
    Ohlcv.TimeseriesPeriod:
      type: object
      properties:
        period_id:
          type: string
          description: Gets or sets the period ID.
          nullable: true
        length_seconds:
          type: integer
          description: Gets or sets the length of the period in seconds.
          format: int32
        length_months:
          type: integer
          description: Gets or sets the length of the period in months.
          format: int32
        unit_count:
          type: integer
          description: Gets or sets the unit count.
          format: int32
          nullable: true
        unit_name:
          type: string
          description: Gets or sets the unit name.
          nullable: true
        display_name:
          type: string
          description: Gets or sets the display name of the timeseries period.
          nullable: true
      additionalProperties: false
      description: Represents a timeseries period used in exchange rate data.
    Orderbooks.AskBidItem:
      type: object
      properties:
        price:
          type: number
          description: Gets or sets the price of the ask/bid item.
          format: double
        size:
          type: number
          description: Gets or sets the size of the ask/bid item.
          format: double
      additionalProperties: false
      description: Represents an item in the ask/bid list of the order book.
    Orderbooks.OrderBook:
      type: object
      properties:
        exchange_id:
          type: string
          description: Gets or sets the exchange identifier.
          nullable: true
        market_id:
          type: string
          description: Gets or sets the market identifier.
          nullable: true
        time_exchange:
          type: string
          description: Gets or sets the exchange time of the order book.
          format: date-time
        time_coinapi:
          type: string
          description: Gets or sets the CoinAPI time when the order book was received.
          format: date-time
        asks:
          type: array
          items:
            $ref: '#/components/schemas/Orderbooks.AskBidItem'
          description: 'The ask levels, ordered from the best (lowest) price.'
          nullable: true
        bids:
          type: array
          items:
            $ref: '#/components/schemas/Orderbooks.AskBidItem'
          description: 'The bid levels, ordered from the best (highest) price.'
          nullable: true
      additionalProperties: false
      description: Represents an order book with additional information and functionality.
    Orderbooks.OrderbookHistoryItem:
      type: object
      properties:
        symbol_id:
          type: string
          description: 'The market identifier as stored in flat files (e.g., `will-it-rain-tomorrow_YES`).'
          nullable: true
        time_exchange:
          type: string
          description: The time of the update on the exchange (UTC).
          format: date-time
        price:
          type: number
          description: The price of the limit order.
          format: double
        size:
          type: number
          description: The size of the limit order.
          format: double
        is_sell_ask:
          type: boolean
          description: 'True for the ask (sell) side, false for the bid (buy) side.'
        update_type:
          type: integer
          description: "The numeric update type: 0 = ADD, 1 = SET, 2 = SUB, 3 = SNAPSHOT, 4 = DELETE,\n5 = DELETE_IF_EXISTS, 6 = SUB_IF_EXISTS, 7 = MATCH, 8 = MATCH_IF_EXISTS, 9 = SET_IF_EXISTS.\nOmitted when not set."
          format: int32
          nullable: true
        id:
          type: string
          description: The order identifier on the exchange. May be empty when the exchange does not provide one.
          nullable: true
      additionalProperties: false
      description: 'A single historical limit order update for a market outcome, as stored in flat files.'
    QuoteTicks.QuoteTick:
      type: object
      properties:
        entry_time:
          type: string
          format: date-time
        recv_time:
          type: string
          format: date-time
        ask:
          type: number
          format: double
        bid:
          type: number
          format: double
        ask_volume:
          type: number
          format: double
        bid_volume:
          type: number
          format: double
      additionalProperties: false
  securitySchemes:
    APIKey:
      type: apiKey
      description: 'API key. Send it in the Authorization header. X-CoinAPI-Key, X-APIBricks-Key and X-APIKey are also accepted.'
      name: Authorization
      in: header
    JWT:
      type: http
      description: 'JWT Authorization header using the Bearer scheme. Example: "Bearer {token}"'
      scheme: bearer
      bearerFormat: JWT
security:
  - APIKey: [ ]
  - JWT: [ ]
