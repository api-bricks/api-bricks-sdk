  '/v1/exchanges/{exchange_id}':
    get:
      tags:
        - Exchanges
      summary: Gets a specific exchange by its unique identifier.
      operationId: predictionmarkets_get_exchange
      parameters:
        - name: exchange_id
          in: path
          description: 'The unique identifier of the exchange (e.g., `POLYMARKET`).'
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The detailed information for the requested exchange.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Exchanges.ExchangeModel'
              examples:
                Example exchange:
                  value:
                    exchange_id: POLYMARKET
                    market_name_institution_description: The world's largest prediction market.
                    website: https://polymarket.com
            application/json:
              schema:
                $ref: '#/components/schemas/Exchanges.ExchangeModel'
              examples:
                Example exchange:
                  value:
                    exchange_id: POLYMARKET
                    market_name_institution_description: The world's largest prediction market.
                    website: https://polymarket.com
            text/json:
              schema:
                $ref: '#/components/schemas/Exchanges.ExchangeModel'
              examples:
                Example exchange:
                  value:
                    exchange_id: POLYMARKET
                    market_name_institution_description: The world's largest prediction market.
                    website: https://polymarket.com
            application/x-msgpack:
              schema:
                $ref: '#/components/schemas/Exchanges.ExchangeModel'
              examples:
                Example exchange:
                  value:
                    exchange_id: POLYMARKET
                    market_name_institution_description: The world's largest prediction market.
                    website: https://polymarket.com
        '404':
          description: Exchange not found
  '/v1/activity/{exchange_id}/{market_id}/current':
    get:
      tags:
        - Market Activity
      summary: Returns the latest trade and the latest quote for a market.
      operationId: predictionmarkets_get_activity_current
      parameters:
        - name: exchange_id
          in: path
          required: true
          schema:
            type: string
        - name: market_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Latest trade and latest quote (either may be null).
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/MarketActivity.MarketActivityCurrent'
            application/json:
              schema:
                $ref: '#/components/schemas/MarketActivity.MarketActivityCurrent'
            text/json:
              schema:
                $ref: '#/components/schemas/MarketActivity.MarketActivityCurrent'
            application/x-msgpack:
              schema:
                $ref: '#/components/schemas/MarketActivity.MarketActivityCurrent'
        '404':
          description: Market not found or no activity
  '/v1/activity/{exchange_id}/{market_id}/latest':
    get:
      tags:
        - Market Activity
      summary: Returns recent trades and recent quotes for a market.
      description: "Trades and quotes are returned as separate lists. The `limit` applies independently to each list\n(default 100, max 10000 per list)."
      operationId: predictionmarkets_get_activity_latest
      parameters:
        - name: exchange_id
          in: path
          description: The unique identifier of the exchange.
          required: true
          schema:
            type: string
        - name: market_id
          in: path
          description: 'The unique identifier of the market, including the outcome suffix.'
          required: true
          schema:
            type: string
        - name: limit
          in: query
          description: 'Maximum number of trades and quotes to return in each list (1-10000, default 100)'
          schema:
            type: integer
            format: int32
            default: 100
      responses:
        '200':
          description: Recent trades and quotes (lists may be empty).
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/MarketActivity.MarketActivityBatch'
            application/json:
              schema:
                $ref: '#/components/schemas/MarketActivity.MarketActivityBatch'
            text/json:
              schema:
                $ref: '#/components/schemas/MarketActivity.MarketActivityBatch'
            application/x-msgpack:
              schema:
                $ref: '#/components/schemas/MarketActivity.MarketActivityBatch'
        '404':
          description: Market not found or no activity
  '/v1/activity/{exchange_id}/{market_id}/history/trades':
    get:
      tags:
        - Market Activity
      summary: Returns historical trades for a market from flat files.
      description: "Retrieves historical trade data from flat files stored in external storage (S3).\nSupports hourly granularity with automatic fallback to daily files.\nUse either 'date' for full day or 'time_start'/'time_end' for specific time ranges.\nThe `limit` parameter applies in both cases (default 100, max 10000), including when `date` selects a full day.\n            \n**Important:** Results are filtered by data processing time (time_coinapi) - the time when CoinAPI\nreceived and processed the data from the exchange. Each trade also includes time_exchange showing\nwhen the trade actually occurred on the exchange. Due to API polling delays, time_exchange may be\nearlier than time_coinapi."
      operationId: predictionmarkets_list_activity_trades_history
      parameters:
        - name: exchange_id
          in: path
          required: true
          schema:
            type: string
        - name: market_id
          in: path
          required: true
          schema:
            type: string
        - name: date
          in: query
          description: Full day in ISO 8601 or YYYY-MM-DD (mutually exclusive with time_start/time_end)
          schema:
            type: string
        - name: time_start
          in: query
          description: Range start in ISO 8601 (required if date is omitted)
          schema:
            type: string
        - name: time_end
          in: query
          description: Range end in ISO 8601 (optional)
          schema:
            type: string
        - name: limit
          in: query
          description: 'Maximum number of trades to return (1-10000, default 100). Applies even when date selects a full day.'
          schema:
            type: integer
            format: int32
            default: 100
      responses:
        '200':
          description: Historical trades in ascending time order
          content:
            text/plain:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MarketActivity.TradeModel'
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MarketActivity.TradeModel'
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MarketActivity.TradeModel'
            application/x-msgpack:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MarketActivity.TradeModel'
  '/v1/activity/{exchange_id}/{market_id}/history/quotes':
    get:
      tags:
        - Market Activity
      summary: Returns historical quotes for a market from flat files.
      description: "Retrieves historical quote (bid/ask) data from flat files stored in external storage (S3).\nSupports hourly granularity with automatic fallback to daily files.\nUse either 'date' for full day or 'time_start'/'time_end' for specific time ranges.\nThe `limit` parameter applies in both cases (default 100, max 10000), including when `date` selects a full day.\n            \n**Important:** Results are filtered by data processing time (time_coinapi) - the time when CoinAPI\nreceived and processed the data from the exchange. Each quote also includes time_exchange showing\nwhen the quote was created on the exchange. Due to API polling delays, time_exchange may be\nearlier than time_coinapi."
      operationId: predictionmarkets_list_activity_quotes_history
      parameters:
        - name: exchange_id
          in: path
          required: true
          schema:
            type: string
        - name: market_id
          in: path
          required: true
          schema:
            type: string
        - name: date
          in: query
          description: Full day in ISO 8601 or YYYY-MM-DD (mutually exclusive with time_start/time_end)
          schema:
            type: string
        - name: time_start
          in: query
          description: Range start in ISO 8601 (required if date is omitted)
          schema:
            type: string
        - name: time_end
          in: query
          description: Range end in ISO 8601 (optional)
          schema:
            type: string
        - name: limit
          in: query
          description: 'Maximum number of quotes to return (1-10000, default 100). Applies even when date selects a full day.'
          schema:
            type: integer
            format: int32
            default: 100
      responses:
        '200':
          description: Historical quotes in ascending time order
          content:
            text/plain:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/QuoteTicks.QuoteTick'
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/QuoteTicks.QuoteTick'
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/QuoteTicks.QuoteTick'
            application/x-msgpack:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/QuoteTicks.QuoteTick'
  '/v1/activity/{exchange_id}/{market_id}/history/ohlcv':
    get:
      tags:
        - Market Activity
      summary: Returns historical OHLCV bars for a market from flat files.
      description: "Retrieves historical OHLCV (Open/High/Low/Close/Volume) bar data - generated from prediction-market\ntrades - from flat files stored in external storage (S3). Supports hourly granularity with automatic\nfallback to daily files. Use either 'date' for full day or 'time_start'/'time_end' for specific time ranges.\nThe `limit` parameter applies in both cases (default 100, max 10000), including when `date` selects a full day.\n            \n**Important:** `period` is required and must be one of `1SEC`, `1MIN`, `1HRS` - the only bar periods the\nprediction-market flat-file pipeline generates today. This differs from the DB-backed `v1/ohlcv` endpoints,\nwhich support the full set of periods (see `GET v1/ohlcv/periods`)."
      operationId: predictionmarkets_list_activity_ohlcv_history
      parameters:
        - name: exchange_id
          in: path
          required: true
          schema:
            type: string
        - name: market_id
          in: path
          required: true
          schema:
            type: string
        - name: date
          in: query
          description: Full day in ISO 8601 or YYYY-MM-DD (mutually exclusive with time_start/time_end)
          schema:
            type: string
        - name: time_start
          in: query
          description: Range start in ISO 8601 (required if date is omitted)
          schema:
            type: string
        - name: time_end
          in: query
          description: Range end in ISO 8601 (optional)
          schema:
            type: string
        - name: period
          in: query
          description: 'Bar period. Required - one of: 1SEC, 1MIN, 1HRS.'
          required: true
          schema:
            type: string
        - name: limit
          in: query
          description: 'Maximum number of bars to return (1-10000, default 100). Applies even when date selects a full day.'
          schema:
            type: integer
            format: int32
            default: 100
      responses:
        '200':
          description: Historical OHLCV bars in ascending time order
          content:
            text/plain:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Ohlcv.TimeseriesItem'
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Ohlcv.TimeseriesItem'
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Ohlcv.TimeseriesItem'
            application/x-msgpack:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Ohlcv.TimeseriesItem'
  '/v1/markets/{exchange_id}/history':
    get:
      tags:
        - Markets
      summary: Lists markets for a specific exchange using cursor-based pagination.
      operationId: predictionmarkets_list_markets_history
      parameters:
        - name: exchange_id
          in: path
          description: 'The unique identifier of the exchange (e.g., `POLYMARKET`).'
          required: true
          schema:
            type: string
        - name: limit
          in: query
          description: 'Maximum number of markets to return (1-10000, default 100).'
          schema:
            type: integer
            format: int32
            default: 100
        - name: cursor
          in: query
          description: Cursor from the previous response's `next_cursor` field. Omit for the first page.
          schema:
            type: string
      responses:
        '200':
          description: A page of markets for the given exchange.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Markets.MarketsPage'
              examples:
                Example list:
                  value:
                    - market_id: WILL-TRUMP-SELL-10K-25K-GOLD-CARDS-IN-2025_YES
                      title: Will Trump sell 10k-25k Gold Cards in 2025?
                      description: Resolves based on official reporting by the Trump Administration.
                      outcome_name: Yes
                      price: 0.12
                      status: Open
                      exchange_id: POLYMARKET
                      outcome_type: Binary
                    - market_id: WILL-TRUMP-SELL-10K-25K-GOLD-CARDS-IN-2025_NO
                      title: Will Trump sell 10k-25k Gold Cards in 2025?
                      outcome_name: No
                      price: 0.88
                      status: Open
                      exchange_id: POLYMARKET
                      outcome_type: Binary
            application/json:
              schema:
                $ref: '#/components/schemas/Markets.MarketsPage'
              examples:
                Example list:
                  value:
                    - market_id: WILL-TRUMP-SELL-10K-25K-GOLD-CARDS-IN-2025_YES
                      title: Will Trump sell 10k-25k Gold Cards in 2025?
                      description: Resolves based on official reporting by the Trump Administration.
                      outcome_name: Yes
                      price: 0.12
                      status: Open
                      exchange_id: POLYMARKET
                      outcome_type: Binary
                    - market_id: WILL-TRUMP-SELL-10K-25K-GOLD-CARDS-IN-2025_NO
                      title: Will Trump sell 10k-25k Gold Cards in 2025?
                      outcome_name: No
                      price: 0.88
                      status: Open
                      exchange_id: POLYMARKET
                      outcome_type: Binary
            text/json:
              schema:
                $ref: '#/components/schemas/Markets.MarketsPage'
              examples:
                Example list:
                  value:
                    - market_id: WILL-TRUMP-SELL-10K-25K-GOLD-CARDS-IN-2025_YES
                      title: Will Trump sell 10k-25k Gold Cards in 2025?
                      description: Resolves based on official reporting by the Trump Administration.
                      outcome_name: Yes
                      price: 0.12
                      status: Open
                      exchange_id: POLYMARKET
                      outcome_type: Binary
                    - market_id: WILL-TRUMP-SELL-10K-25K-GOLD-CARDS-IN-2025_NO
                      title: Will Trump sell 10k-25k Gold Cards in 2025?
                      outcome_name: No
                      price: 0.88
                      status: Open
                      exchange_id: POLYMARKET
                      outcome_type: Binary
            application/x-msgpack:
              schema:
                $ref: '#/components/schemas/Markets.MarketsPage'
              examples:
                Example list:
                  value:
                    - market_id: WILL-TRUMP-SELL-10K-25K-GOLD-CARDS-IN-2025_YES
                      title: Will Trump sell 10k-25k Gold Cards in 2025?
                      description: Resolves based on official reporting by the Trump Administration.
                      outcome_name: Yes
                      price: 0.12
                      status: Open
                      exchange_id: POLYMARKET
                      outcome_type: Binary
                    - market_id: WILL-TRUMP-SELL-10K-25K-GOLD-CARDS-IN-2025_NO
                      title: Will Trump sell 10k-25k Gold Cards in 2025?
                      outcome_name: No
                      price: 0.88
                      status: Open
                      exchange_id: POLYMARKET
                      outcome_type: Binary
        '400':
          description: Bad request - invalid limit
        '404':
          description: Market not found
  '/v1/markets/{exchange_id}/active':
    get:
      tags:
        - Markets
      summary: Lists active market IDs for a specific exchange.
      description: "Returns only market IDs (not full market objects) because this data is derived from recent quotes and transactions only.\nUse the /history endpoint to retrieve full market details."
      operationId: predictionmarkets_list_markets_active
      parameters:
        - name: exchange_id
          in: path
          description: 'The unique identifier of the exchange (e.g., `POLYMARKET`).'
          required: true
          schema:
            type: string
        - name: limit
          in: query
          description: 'Maximum number of market IDs to return (1-10000, default 100).'
          schema:
            type: integer
            format: int32
            default: 100
        - name: page
          in: query
          description: 'Page number (1-based, >= 1, default 1). Internally converted to offset = (page - 1) * limit.'
          schema:
            type: integer
            format: int32
            default: 1
      responses:
        '200':
          description: A list of active market IDs for the given exchange.
          content:
            text/plain:
              schema:
                type: array
                items:
                  type: string
              examples:
                Example active market IDs:
                  value:
                    - WILL-TRUMP-SELL-10K-25K-GOLD-CARDS-IN-2025_YES
                    - WILL-TRUMP-SELL-10K-25K-GOLD-CARDS-IN-2025_NO
                    - NFL-PIT-CAR-2025-08-21-SPREAD-AWAY-5PT5_YES
                    - NFL-PIT-CAR-2025-08-21-SPREAD-AWAY-5PT5_NO
                    - CRYPTO-BTC-PRICE-ABOVE-100K-BY-EOY-2025_YES
            application/json:
              schema:
                type: array
                items:
                  type: string
              examples:
                Example active market IDs:
                  value:
                    - WILL-TRUMP-SELL-10K-25K-GOLD-CARDS-IN-2025_YES
                    - WILL-TRUMP-SELL-10K-25K-GOLD-CARDS-IN-2025_NO
                    - NFL-PIT-CAR-2025-08-21-SPREAD-AWAY-5PT5_YES
                    - NFL-PIT-CAR-2025-08-21-SPREAD-AWAY-5PT5_NO
                    - CRYPTO-BTC-PRICE-ABOVE-100K-BY-EOY-2025_YES
            text/json:
              schema:
                type: array
                items:
                  type: string
              examples:
                Example active market IDs:
                  value:
                    - WILL-TRUMP-SELL-10K-25K-GOLD-CARDS-IN-2025_YES
                    - WILL-TRUMP-SELL-10K-25K-GOLD-CARDS-IN-2025_NO
