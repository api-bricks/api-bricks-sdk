  '/v1/activity/{exchange_id}/{market_id}/current':
    get:
      tags:
        - Market Activity
      summary: Returns the latest trade and the latest quote for a market.
      parameters:
        - name: exchange_id
          in: path
          required: true
          schema:
            type: string
        - name: market_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Latest trade and latest quote (either may be null).
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/MarketActivity.MarketActivityCurrent'
            application/json:
              schema:
                $ref: '#/components/schemas/MarketActivity.MarketActivityCurrent'
            text/json:
              schema:
                $ref: '#/components/schemas/MarketActivity.MarketActivityCurrent'
            application/x-msgpack:
              schema:
                $ref: '#/components/schemas/MarketActivity.MarketActivityCurrent'
        '404':
          description: Market not found or no activity
  '/v1/activity/{exchange_id}/{market_id}/latest':
    get:
      tags:
        - Market Activity
      summary: Returns recent trades and recent quotes for a market.
      description: "Trades and quotes are returned as separate lists. The `limit` applies independently to each list\n(default 100, max 10000 per list)."
      parameters:
        - name: exchange_id
          in: path
          description: The unique identifier of the exchange.
          required: true
          schema:
            type: string
        - name: market_id
          in: path
          description: 'The unique identifier of the market, including the outcome suffix.'
          required: true
          schema:
            type: string
        - name: limit
          in: query
          description: 'Maximum number of trades and quotes to return in each list (1-10000, default 100)'
          schema:
            type: integer
            format: int32
            default: 100
      responses:
        '200':
          description: Recent trades and quotes (lists may be empty).
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/MarketActivity.MarketActivityBatch'
            application/json:
              schema:
                $ref: '#/components/schemas/MarketActivity.MarketActivityBatch'
            text/json:
              schema:
                $ref: '#/components/schemas/MarketActivity.MarketActivityBatch'
            application/x-msgpack:
              schema:
                $ref: '#/components/schemas/MarketActivity.MarketActivityBatch'
        '404':
          description: Market not found or no activity
  '/v1/activity/{exchange_id}/{market_id}/history/trades':
    get:
      tags:
        - Market Activity
      summary: Returns historical trades for a market from flat files.
      description: "Retrieves historical trade data from flat files stored in external storage (S3).\nSupports hourly granularity with automatic fallback to daily files.\nUse either 'date' for full day or 'time_start'/'time_end' for specific time ranges.\nThe `limit` parameter applies in both cases (default 100, max 10000), including when `date` selects a full day.\n            \n**Important:** Results are filtered by data processing time (time_coinapi) - the time when CoinAPI\nreceived and processed the data from the exchange. Each trade also includes time_exchange showing\nwhen the trade actually occurred on the exchange. Due to API polling delays, time_exchange may be\nearlier than time_coinapi."
      parameters:
        - name: exchange_id
          in: path
          required: true
          schema:
            type: string
        - name: market_id
          in: path
          required: true
          schema:
            type: string
        - name: date
          in: query
          description: Full day in ISO 8601 or YYYY-MM-DD (mutually exclusive with time_start/time_end)
          schema:
            type: string
        - name: time_start
          in: query
          description: Range start in ISO 8601 (required if date is omitted)
          schema:
            type: string
        - name: time_end
          in: query
          description: Range end in ISO 8601 (optional)
          schema:
            type: string
        - name: limit
          in: query
          description: 'Maximum number of trades to return (1-10000, default 100). Applies even when date selects a full day.'
          schema:
            type: integer
            format: int32
            default: 100
      responses:
        '200':
          description: Historical trades in ascending time order
          content:
            text/plain:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MarketActivity.TradeModel'
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MarketActivity.TradeModel'
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MarketActivity.TradeModel'
            application/x-msgpack:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MarketActivity.TradeModel'
  '/v1/activity/{exchange_id}/{market_id}/history/quotes':
    get:
      tags:
        - Market Activity
      summary: Returns historical quotes for a market from flat files.
      description: "Retrieves historical quote (bid/ask) data from flat files stored in external storage (S3).\nSupports hourly granularity with automatic fallback to daily files.\nUse either 'date' for full day or 'time_start'/'time_end' for specific time ranges.\nThe `limit` parameter applies in both cases (default 100, max 10000), including when `date` selects a full day.\n            \n**Important:** Results are filtered by data processing time (time_coinapi) - the time when CoinAPI\nreceived and processed the data from the exchange. Each quote also includes time_exchange showing\nwhen the quote was created on the exchange. Due to API polling delays, time_exchange may be\nearlier than time_coinapi."
      parameters:
        - name: exchange_id
          in: path
          required: true
          schema:
            type: string
        - name: market_id
          in: path
          required: true
          schema:
            type: string
        - name: date
          in: query
          description: Full day in ISO 8601 or YYYY-MM-DD (mutually exclusive with time_start/time_end)
          schema:
            type: string
        - name: time_start
          in: query
          description: Range start in ISO 8601 (required if date is omitted)
          schema:
            type: string
        - name: time_end
          in: query
          description: Range end in ISO 8601 (optional)
          schema:
            type: string
        - name: limit
          in: query
          description: 'Maximum number of quotes to return (1-10000, default 100). Applies even when date selects a full day.'
          schema:
            type: integer
            format: int32
            default: 100
      responses:
        '200':
          description: Historical quotes in ascending time order
          content:
            text/plain:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/QuoteTicks.QuoteTick'
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/QuoteTicks.QuoteTick'
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/QuoteTicks.QuoteTick'
            application/x-msgpack:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/QuoteTicks.QuoteTick'
  '/v1/markets/{exchange_id}/history':
    get:
      tags:
        - Markets
      summary: Lists markets for a specific exchange using cursor-based pagination.
      parameters:
        - name: exchange_id
          in: path
          description: 'The unique identifier of the exchange (e.g., `POLYMARKET`).'
          required: true
          schema:
            type: string
        - name: limit
          in: query
          description: 'Maximum number of markets to return (1-10000, default 100).'
          schema:
            type: integer
            format: int32
            default: 100
        - name: cursor
          in: query
          description: Cursor from the previous response's `next_cursor` field. Omit for the first page.
          schema:
            type: string
      responses:
        '200':
          description: A page of markets for the given exchange.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Markets.MarketsPage'
              examples:
                Example list:
                  value:
                    - market_id: WILL-TRUMP-SELL-10K-25K-GOLD-CARDS-IN-2025_YES
                      title: Will Trump sell 10k-25k Gold Cards in 2025?
                      description: Resolves based on official reporting by the Trump Administration.
                      outcome_name: Yes
