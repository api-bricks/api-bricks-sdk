  '/v1/orderbook/{exchange_id}/{market_id}/current':
    get:
      tags:
        - Orderbooks
      summary: Gets the current order book snapshot for a specific market outcome.
      description: "Returns the latest full order book snapshot when one is available. Otherwise the book is built from the\nlatest quote, so it holds at most one ask and one bid level.\n            \nThe response is always 200. When there is neither a snapshot nor a quote for the market (including an\nunknown market), `asks` and `bids` are empty and `time_exchange`/`time_coinapi` are set to the current time."
      operationId: predictionmarkets_get_orderbook_current
      parameters:
        - name: exchange_id
          in: path
          description: 'The unique identifier of the exchange (e.g., `POLYMARKET`).'
          required: true
          schema:
            type: string
        - name: market_id
          in: path
          description: 'The unique identifier of the market (including outcome), e.g., `will-it-rain_yes`.'
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The current order book snapshot for the specified market outcome. Empty asks and bids when no data is available.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Orderbooks.OrderBook'
              examples:
                Example orderbook:
                  value:
                    exchange_id: POLYMARKET
                    market_id: market_yes
                    time_exchange: '0001-01-01T00:00:00.0000000Z'
                    time_coinapi: '0001-01-01T00:00:00.0000000Z'
                    asks: [ ]
                    bids: [ ]
            application/json:
              schema:
                $ref: '#/components/schemas/Orderbooks.OrderBook'
              examples:
                Example orderbook:
                  value:
                    exchange_id: POLYMARKET
                    market_id: market_yes
                    time_exchange: '0001-01-01T00:00:00.0000000Z'
                    time_coinapi: '0001-01-01T00:00:00.0000000Z'
                    asks: [ ]
                    bids: [ ]
            text/json:
              schema:
                $ref: '#/components/schemas/Orderbooks.OrderBook'
              examples:
                Example orderbook:
                  value:
                    exchange_id: POLYMARKET
                    market_id: market_yes
                    time_exchange: '0001-01-01T00:00:00.0000000Z'
                    time_coinapi: '0001-01-01T00:00:00.0000000Z'
                    asks: [ ]
                    bids: [ ]
            application/x-msgpack:
              schema:
                $ref: '#/components/schemas/Orderbooks.OrderBook'
              examples:
                Example orderbook:
                  value:
                    exchange_id: POLYMARKET
                    market_id: market_yes
                    time_exchange: '0001-01-01T00:00:00.0000000Z'
                    time_coinapi: '0001-01-01T00:00:00.0000000Z'
                    asks: [ ]
                    bids: [ ]
  '/v1/orderbook/{exchange_id}/{market_id}/history':
    get:
      tags:
        - Orderbooks
      summary: Returns historical orderbook limit orders for a market from flat files.
      description: "Retrieves historical limit order data from flat files stored in external storage (S3).\nReturns raw limit order updates (adds, updates, deletes) rather than reconstructed snapshots.\nSupports hourly granularity with automatic fallback to daily files.\nUse either 'date' for full day or 'time_start'/'time_end' for specific time ranges.\nThe `limit` parameter applies in both cases (default 100, max 10000), including when `date` selects a full day.\n            \n**Important:** Results are filtered by data processing time (time_coinapi) - the time when CoinAPI\nreceived and processed the data from the exchange. Each order also includes time_exchange showing\nwhen the order was created/updated on the exchange. Due to API polling delays, time_exchange may be\nearlier than time_coinapi."
      operationId: predictionmarkets_list_orderbook_history
      parameters:
        - name: exchange_id
          in: path
          required: true
          schema:
            type: string
        - name: market_id
          in: path
          required: true
          schema:
            type: string
        - name: date
          in: query
          description: Full day in ISO 8601 or YYYY-MM-DD (mutually exclusive with time_start/time_end)
          schema:
            type: string
        - name: time_start
          in: query
          description: Range start in ISO 8601 (required if date is omitted)
          schema:
            type: string
        - name: time_end
          in: query
          description: Range end in ISO 8601 (optional)
          schema:
            type: string
        - name: limit
          in: query
          description: 'Maximum number of limit order updates to return (1-10000, default 100). Applies even when date selects a full day.'
          schema:
            type: integer
            format: int32
            default: 100
      responses:
        '200':
          description: Historical limit order updates in ascending time order
          content:
            text/plain:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Orderbooks.OrderbookHistoryItem'
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Orderbooks.OrderbookHistoryItem'
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Orderbooks.OrderbookHistoryItem'
            application/x-msgpack:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Orderbooks.OrderbookHistoryItem'
        '400':
          description: 'Neither date nor time_start provided, date is not a full day, time_end is before time_start, or limit is outside 1-10000'
components:
  schemas:
    Exchanges.ExchangeModel:
      type: object
