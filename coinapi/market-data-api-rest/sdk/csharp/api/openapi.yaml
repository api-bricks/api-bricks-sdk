        \ denominate the contract unit\n            \n### Additional output variables\
        \ for `symbol_type = PERPETUAL`\n            \nVariable | Description\n---------\
        \ | -----------\nfuture_contract_unit | Contact size *(eg. 10 BTC if `future_contract_unit`\
        \ = `10` and `future_contract_unit_asset` = `BTC`)*\nfuture_contract_unit_asset\
        \ | Identifier of the asset used to denominate the contract unit\n       \
        \     \n### Additional output variables for `symbol_type = DEPLOYER_PERPETUAL`\n\
        \            \nVariable | Description\n--------- | -----------\nfuture_contract_unit\
        \ | Contact size *(eg. 10 BTC if `future_contract_unit` = `10` and `future_contract_unit_asset`\
        \ = `BTC`)*\nfuture_contract_unit_asset | Identifier of the asset used to\
        \ denominate the contract unit\n            \n### Additional output variables\
        \ for `symbol_type = OPTION`\n            \nVariable | Description\n---------\
        \ | -----------\noption_type_is_call | Boolean value representing option type.\
        \ `true` for Call options, `false` for Put options\noption_strike_price |\
        \ Price at which option contract can be exercised\noption_contract_unit |\
        \ Base asset amount of underlying spot which single option represents\noption_exercise_style\
        \ | Option exercise style. Can be `EUROPEAN` or `AMERICAN`\noption_expiration_time\
        \ | Option contract expiration time in ISO 8601\n            \n### Additional\
