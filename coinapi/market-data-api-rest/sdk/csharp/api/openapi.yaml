  /v1/orderbooks/{symbol_id}/history:
    get:
      description: "Get historical order book snapshots for a specific symbol within\
        \ time range, returned in time ascending order.\n            \n:::info\nThe\
        \ historical order book data via the REST API is currently limited by a number\
        \ of updates and to the maximum number of 50 levels.\n:::\n            \n\
        This endpoint supports hourly granularity for APITP data with automatic fallback\
        \ to daily data for older records.\nTimestamps are normalized to hour boundaries,\
        \ and data is fetched per hour with precise filtering to your exact time range.\n\
        \            \n:::tip\nFor querying a full day of data, use the 'date' parameter.\
        \ For specific time ranges (including cross-day or multi-hour queries), use\
        \ 'time_start' and 'time_end'.\n:::"
      parameters:
      - description: Symbol identifier for requested timeseries (from the Metadata
          -> Symbols)
        explode: false
        in: path
        name: symbol_id
        required: true
        schema:
          type: string
        style: simple
      - description: "Date in ISO 8601, returned data is for the whole given day (required\
          \ if 'time_start' is not provided)"
        explode: true
        in: query
        name: date
        required: false
        schema:
          type: string
        style: form
      - description: "Starting time in ISO 8601 (supports hourly precision, e.g.,\
          \ 2026-01-16T11:00:00Z)"
        explode: true
        in: query
        name: time_start
        required: false
        schema:
          type: string
        style: form
      - description: "Timeseries ending time in ISO 8601 (optional, supports cross-day\
          \ queries)"
        explode: true
        in: query
        name: time_end
        required: false
        schema:
          type: string
        style: form
      - description: "Amount of items to return (optional, minimum is 1, maximum is\
          \ 100000, default value is 100, if the parameter is used then every 100\
          \ output items are counted as one request)"
        explode: true
        in: query
        name: limit
        required: false
        schema:
          default: 100
          format: int32
          type: integer
        style: form
      - description: "Maximum amount of levels from each side of the book to include\
          \ in response (optional, maximum is 50)"
        explode: true
        in: query
        name: limit_levels
        required: false
        schema:
          format: int32
          type: integer
        style: form
      responses:
        "200":
          content:
            text/plain:
              examples:
                Example response:
                  value:
                  - symbol_id: BITSTAMP_SPOT_BTC_USD
                    time_exchange: 2013-09-28T22:40:50.0000000Z
