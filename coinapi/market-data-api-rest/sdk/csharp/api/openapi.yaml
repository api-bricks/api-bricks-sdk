  /v1/symbols/{exchange_id}/active:
    get:
      description: "Retrieves all currently active (listed) symbols, with optional\
        \ filtering.\n            \n:::info\n\"price_precision\" and \"size_precision\"\
        \ are data precisions and are not always the same precisions used for trading\
        \ eg. for the \"BINANCE\" exchanges.\n:::\n            \n:::info\nYou should\
        \ not assume that the market data will be always within the resolution provided\
        \ by the \"price_precision\" and \"size_precision\". The fact that the precision\
        \ values can be derived from a posterior implies the fact that this data could\
        \ be delayed, also it can be changed by the data source without notice and\
        \ we will immediately deliver data with the new precision while could not\
        \ update the precision values in this endpoint immediately.\n:::\n       \
        \     \n### Symbol identifier\n            \nOur symbol identifier is created\
        \ using a pattern that depends on symbol type.\n            \nType | `symbol_id`\
        \ pattern\n--------- | ---------\nSPOT | `{exchange_id}_SPOT_{asset_id_base}_{asset_id_quote}`\n\
        FUTURES | `{exchange_id}_FTS_{asset_id_base}_{asset_id_quote}_{YYMMDD of future_delivery_time}`\n\
        OPTION | `{exchange_id}_OPT_{asset_id_base}_{asset_id_quote}_{YYMMDD of option_expiration_time}_{option_strike_price}_{option_type_is_call\
        \ as C/P}`\nPERPETUAL | `{exchange_id}_PERP_{asset_id_base}_{asset_id_quote}`\n\
        DEPLOYER_PERPETUAL | `{exchange_id}_DPERP_{deployer_symbol}_{asset_id_quote}`\n\
        INDEX | `{exchange_id}_IDX_{index_id}`\nCREDIT | `{exchange_id}_CRE_{asset_id_base}`\n\
        CONTACT  | `{exchange_id}_COT_{contract_id}`\nOPTION_COMBO | `{exchange_id}_OPTCMB_{exchange_symbol_id}`\n\
        FUTURE_COMBO | `{exchange_id}_FTSCMB_{exchange_symbol_id}`\n            \n\
        :::info\nIn the unlikely event when the \"symbol_id\" for more than one market\
        \ is the same. We will append the additional term (prefixed with the \"_\"\
        ) at the end of the duplicated identifiers to differentiate them.\n:::info\n\
        \            \n### Symbol types list (enumeration of `symbol_type` output\
        \ variable)\n            \nType | Name | Description\n-------- | - | -----------\n\
        SPOT | FX Spot | Agreement to exchange one asset for another one *(e.g. Buy\
        \ BTC for USD)*\nFUTURES | Futures contract | FX Spot derivative contract\
        \ where traders agree to trade fx spot at predetermined future time\nOPTION\
        \ | Option contract | FX Spot derivative contract where traders agree to trade\
        \ right to require buy or sell of fx spot at agreed price on exercise date\n\
        PERPETUAL | Perpetual contract | FX Spot derivative contract where traders\
        \ agree to trade fx spot continously without predetermined future delivery\
        \ time\nDEPLOYER_PERPETUAL | Deployer Perpetual contract | Perpetual contract\
        \ for user-deployed markets *(e.g. Hyperliquid user-deployed perpetuals)*\n\
        INDEX | Index | Statistical composite that measures changes in the economy\
        \ or markets.\nCREDIT | Credit/Funding | Margin funding contract. Order book\
        \ displays lending offers and borrow bids. Price represents the daily rate.\n\
        CONTRACT | Contract | Represents other types of financial instruments *(e.g.\
        \ spreads, interest rate swap)*\nOPTION_COMBO | Option Combo | Multi-leg option\
        \ strategy combining two or more option positions *(e.g. put spread, protective\
        \ collar)*\nFUTURE_COMBO | Future Combo | Multi-leg futures calendar spread\
        \ combining two futures positions *(e.g. futures vs perpetual)*\n        \
        \    \n### Additional output variables for `symbol_type = INDEX`\n       \
        \     \nVariable | Description\n--------- | -----------\nindex_id | Index\
        \ identifier\nindex_display_name | Human readable name of the index *(optional)*\n\
        index_display_description | Description of the index *(optional)*\n      \
        \      \n### Additional output variables for `symbol_type = FUTURES`\n   \
        \         \nVariable | Description\n--------- | -----------\nfuture_delivery_time\
        \ | Predetermined time of futures contract delivery date in ISO 8601\nfuture_contract_unit\
        \ | Contact size *(eg. 10 BTC if `future_contract_unit` = `10` and `future_contract_unit_asset`\
